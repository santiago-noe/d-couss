<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f0d">
  <title>Registro — D'COUSS Promoción 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .auth { min-height: 100vh; min-height: 100svh; display: grid; }
    @media (min-width: 900px) { .auth { grid-template-columns: 1.1fr 1fr; } }

    .auth__visual { position: relative; min-height: 260px; isolation: isolate; display: flex; align-items: flex-end; padding: var(--s-7); }
    .auth__visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; }
    .auth__visual::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgba(7,10,9,.9), rgba(7,10,9,.15) 60%); }
    .auth__visual p { font-family: var(--font-display); font-weight: 300; font-size: clamp(24px, 3vw, 38px); line-height: 1.2; max-width: 18ch; }
    .auth__visual em { color: var(--accent); }

    .auth__panel { display: flex; flex-direction: column; justify-content: center; padding: var(--s-7) var(--s-5); }
    @media (min-width: 900px) { .auth__panel { padding: var(--s-8) var(--s-9); } }
    .auth__back { display: inline-flex; align-items: center; gap: var(--s-2); font-size: 13px; color: var(--text-muted); margin-bottom: var(--s-8); width: fit-content; }
    .auth__back:hover { color: var(--accent); }

    .auth form { width: 100%; max-width: 400px; }
    .auth h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(36px, 4vw, 48px); line-height: 1.05; letter-spacing: -.02em; }
    .auth__lead { color: var(--text-muted); margin: var(--s-3) 0 var(--s-7); }

    .field { position: relative; margin-bottom: var(--s-4); }
    .field .material-symbols-outlined { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); transition: color .3s var(--ease); pointer-events: none; }
    .field input {
      width: 100%;
      padding: 15px 16px 15px 48px;
      font: inherit; font-size: 15px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color .3s var(--ease), background .3s var(--ease);
    }
    .field input::placeholder { color: var(--text-dim); }
    .field input:focus { border-color: var(--accent); background: var(--surface-2); }
    .field:focus-within .material-symbols-outlined { color: var(--accent); }
    .auth .btn { width: 100%; margin-top: var(--s-3); }
  </style>
</head>
<body>
  <main class="auth">
    <aside class="auth__visual">
      <img src="aula5.jpg" alt="La promoción D'COUSS 2026">
      <p>Y si no es eterno, <em>que sea inolvidable.</em></p>
    </aside>

    <section class="auth__panel">
      <a class="auth__back" href="index.html"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span> Volver al inicio</a>

      <form action="/action_page.php">
        <span class="eyebrow">D'COUSS · Promoción 2026</span>
        <h1>Registro</h1>
        <p class="auth__lead">Crea tu acceso para guardar y revivir los recuerdos de la promoción.</p>

        <label class="field">
          <span class="material-symbols-outlined" aria-hidden="true">person</span>
          <input type="text" placeholder="Nombre de usuario" name="usrnm" autocomplete="username" aria-label="Nombre de usuario">
        </label>

        <label class="field">
          <span class="material-symbols-outlined" aria-hidden="true">mail</span>
          <input type="email" placeholder="Email" name="email" autocomplete="email" aria-label="Email">
        </label>

        <label class="field">
          <span class="material-symbols-outlined" aria-hidden="true">key</span>
          <input type="password" placeholder="Contraseña" name="psw" autocomplete="new-password" aria-label="Contraseña">
        </label>

        <button type="submit" class="btn btn--primary btn--lg">Ingresar</button>
      </form>
    </section>
  </main>
</body>
</html>
